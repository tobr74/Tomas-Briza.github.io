<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomáš Bříza - programátor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="box">
  <div id="datum-vlevo" style="position: absolute; top: 35px; left: 15px; font-size: 13px; font-weight: bold;"></div>
  
  <!-- NOVÝ PRVEK PRO HODINY -->
  <div id="hodiny-stred" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; font-family: monospace;"></div>
  
  <div id="svatek-vpravo" style="position: absolute; top: 35px; right: 15px; font-size: 13px; font-weight: bold;"></div>
  <div class="kruh"></div>
  <h3 class="TB">TB</h3>
  <h1 class="jmeno">Tomáš Bříza</h1>
  <p class="programator">programátor</p>
  <button type="text" name="kontaktovat" id="kontaktovat">Kontakt</button>
  <div name="kontakt" id="kontakt"></div>
  <div><button type="text" id="zapni-barvu">Zapni a nebo vypni barvu pozadí a úkolu</button>
  </div>
  <div style="margin-bottom: 10px;">
    <span style="font-size: 18px;">Zvol si vlastní barvu:</span>
    <input type="color" id="barevnaSkala" value="#ffffff" style="cursor: pointer; height: 25px;">
  </div>
  <div class="container">
    <h4 class="pridatNU-nadpis">📝Přidat nový úkol📝</h4>
    <div class="pridprio">
      <select id="priorita">
        <option value="green">🟢 Normální</option>
        <option value="orange">🟡 Spěchá</option>
        <option value="red">🔴 Důležité</option>
      </select>
      <input type="text" id="novyUkol" placeholder="Nový úkol...">
      <button id="pridat">Přidat</button>
    </div>
    <div class="pridatSeznam">
      <ul type="text" name="mujSeznam" id="mujSeznam"></ul>

      <h1 class="moudra">Moudra programátora</h1>

      <!-- Tady propojujeme JS funkci s kliknutím -->
      <button onclick="ukazCitat()">Chci radu!</button>

      <!-- Tlačítko, které spouští tvou funkci -->
      <button onclick="klikni()">KLIKNI NA MĚ!</button>

      <!-- Tady se bude zobrazovat skóre -->
      <h1 id="pocitadlo">Skóre: 0</h1>

      <form onsubmit="alert('Odesláno!'); return false;">
        <input class="email" type="email" placeholder="Tvůj e-mail" required>
        <button id="odeslat" type="submit">Odeslat</button>
      </form>

    </div>
  </div>
</div>

<script src="script.js?v=1.1"></script>

  <!-- 2. Pak samostatně zaregistrujeme Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("SW registrován"))
        .catch(err => console.log("Chyba SW:", err));
    }
  </script>
</body>
</html>
