<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomáš Bříza - programátor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div id="moje-okno" class="modal">
    <div class="modal-obsah">
        <span class="zavrit">&times;</span>
        
        <!-- TYTO DVA ŘÁDKY JSOU KLÍČOVÉ PRO PŘEPISOVÁNÍ TEXTU -->
        <h3 id="nadpis-okna">Vyhledat svátek</h3>
        <p id="napoveda-okna">Zadej jméno nebo datum</p>
        
        <input type="text" id="vstup-hledani" placeholder="Napište sem">
        <button id="tlacitko-hledat">Vyhledat</button>
        
        <div id="vysledek-hledani"></div>
    </div>
</div>

<div class="box">
  <!-- HORNÍ LIŠTA -->
  <div id="datum-vlevo" style="position: absolute; top: 35px; left: 15px; font-size: 13px; font-weight: bold;"></div>
  <div id="hodiny-stred" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; font-family: monospace;"></div>
  <div id="svatek-vpravo" style="position: absolute; top: 35px; right: 15px; font-size: 13px; font-weight: bold;display: inline-block"></div>

  <!-- HLAVNÍ OBSAH (FLEX WRAPPER) -->
  <div class="flex-wrapper">
    
    <!-- LEVÁ ČÁST: Vizitka -->
    <div class="vizitka-cast">

      <div class="kruh">
      <h3 class="TB">TB</h3>
      </div>

      <h1 class="jmeno">Tomáš Bříza</h1>

      <p class="programator">programátor</p>

      <button id="kontaktovat">Kontakt</button>
      <div id="kontakt"></div>

      <!-- Tlačítka pro přepínání režimů -->
      <button id="zapni-obrazek" onclick="zapniObrazek()">Zapni/Vypni obrázek</button>
      <button id="zapni-barvu" onclick="prepniBarvu()">Zapni/Vypni barvu</button>
      
      <!-- Barevná škála -->
      <div style="margin-bottom: 10px;">
          <span>Zvol si barvu:</span>
          <input type="color" id="barevnaSkala">
      </div>

      <!-- SEKCE MOUDRA A HRY -->
      <div id="moudra-hry" style="margin-top: 10px;">
        <div style="display: flex; justify-content: space-around; align-items: flex-end; gap: 10px;">
          <div style="display: flex; flex-direction: column; align-items: center;">
            <h1 class="moudra" style="font-size: 14px; margin-bottom: 0px;">Moudra<br> programátora</h1>
            <button onclick="ukazMoudro()">Chci radu!</button>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center;">
            <h1 id="pocitadlo" style="font-size: 14px; margin-bottom: 0px;">Skóre: 0</h1>
            <button onclick="klikni()">KLIKNI NA MĚ!</button>
          </div>
        </div>
      </div>
      
      <!-- SEKCE CITATY A VTIPY -->
      <div id="citaty-vtipy" style="margin-top: 0px; margin-left: 0px;">
        <div style="display: flex; justify-content: space-around; align-items: flex-end; gap: 10px;">
          <div style="display: flex; flex-direction: column; align-items: center;">
            <h1 class="citaty" style="font-size: 14px; margin-bottom: 0px;">Pravdivé citáty</h1>
            <button onclick="ukazCitat()">Chci poučit!</button>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center;">
            <h1 class="vtipy" style="font-size: 14px; margin-bottom: 0px;">Vtipy pro zasmání</h1>
            <button onclick="ukazVtip()">KLIKNI A POBAV SE!</button>
          </div>
        </div>
        <h2 class="rukopis">Děkuji za Vaši návštěvu</h2>
      </div>
    </div>

    <!-- PRAVÁ ČÁST: Úkoly a Formulář -->
    <div class="container">
      <h4 class="pridatNU-nadpis">📝 Přidat nový úkol 📝</h4>
      <div class="pridprio">
        <select id="priorita">
          <option value="green">🟢 Normální</option>
          <option value="orange">🟡 Spěchá</option>
          <option value="red">🔴 Důležité</option>
        </select>
        <input type="text" id="novyUkol" placeholder="Nový úkol...">
        <button id="pridat">Přidat úkol</button>
      </div>

      <div class="pridatSeznam">
        <ul id="mujSeznam"></ul>
        <div id="taskModal" class="modal hidden">
        <div class="modal-overlay"></div>
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 style="margin-top:0">➕ Přidat položku úkolu</h3>
            <input type="text" id="modalInput" placeholder="Napište sem položku úkolu">
            <button id="modalConfirm" style="background:#28a745; color:white; border:none; padding:15px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold;margin:20px 0 0 0;"><b>Přidat položku úkolu</b><br><br/><i>(zavřete prosím křížkem, aby bylo možné přidat více položek za sebou)</i></button>
          </div>
        </div>

        <!-- FORMULÁŘ -->
        <form action="https://formspree.io/f/mqeydyly" method="POST" class="feedback-form">
          <h2 style="padding: 0; margin: 0;margin-top: 8px; ">Dotazník spokojenosti</h2>
          <input type="text" name="jmeno" placeholder="Tvé jméno">
          <select name="hodnoceni" required>
            <option value="" disabled selected>Líbí se ti web?</option>
            <option value="libi">👍 Líbí</option>
            <option value="nelibi">👎 Nelíbí</option>
          </select>
          <textarea name="zprava" placeholder="Co se ti líbí nebo co vylepšit?" rows="3"></textarea>
          <input type="email" name="email" placeholder="Tvůj e-mail" required>
          <button type="submit" id="odeslat-feedback">Odeslat zpětnou vazbu</button>
        </form>

      </div> <!-- Konec pridatSeznam -->
    </div> <!-- Konec container -->
  </div> <!-- Konec flex-wrapper -->
</div> <!-- Konec box -->

<script src="script.js?v=1.1"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("SW registrován"))
      .catch(err => console.log("Chyba SW:", err));
  }
</script>
</body>
</html>
