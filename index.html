<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomáš Bříza - programátor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="box">
  <!-- PRVEK PRO DATUM VLEVO -->
  <div id="datum-vlevo" style="position: absolute; top: 35px; left: 15px; font-size: 13px; font-weight: bold;"></div>
  <!-- PRVEK PRO HODINY UPROSTŘED -->
  <div id="hodiny-stred" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; font-family: monospace;"></div>
  <!-- PRVEK PRO SVÁTEK VPRAVO -->
  <div id="svatek-vpravo" style="position: absolute; top: 35px; right: 15px; font-size: 13px; font-weight: bold;"></div>
  <!-- NOVÝ OBAL PRO OBSAH -->
  <div class="flex-wrapper">
    
    <!-- LEVÁ ČÁST: Vizitka -->
    <div class="vizitka-cast">
      <div class="kruh"></div>
      <h3 class="TB">TB</h3>
      <h1 class="jmeno">Tomáš Bříza</h1>
      <p class="programator">programátor</p>
      <button id="kontaktovat">Kontakt</button>
      <div id="kontakt"></div>
      <button id="zapni-barvu">Zapni/Vypni barvu</button>
      <div style="margin-bottom: 10px;">
        <span>Zvol si barvu:</span>
        <input type="color" id="barevnaSkala">
      </div>
    </div>
    <div class="container">
      <h4 class="pridatNU-nadpis">📝Přidat nový úkol📝</h4>
      <div class="pridprio">
        <select id="priorita">
          <option value="green">🟢 Normální</option>
          <option value="orange">🟡 Spěchá</option>
          <option value="red">🔴 Důležité</option>
        </select>
        <input type="text" id="novyUkol" placeholder="Nový úkol...">
        <button id="pridat">Přidat</button>
      </div>
      <div class="pridatSeznam">
        <ul type="text" name="mujSeznam" id="mujSeznam"></ul>

        <div id="rady-hry" style="margin-top: 20px;">
  <!-- Obal pro dvě sekce vedle sebe -->
  <div style="display: flex; justify-content: space-around; align-items: flex-end; gap: 10px;">
    
    <!-- LEVÁ ČÁST: Moudra -->
    <div style="display: flex; flex-direction: column; align-items: center;">
      <h1 class="moudra" style="font-size: 14px; margin-bottom: 5px;">Moudra programátora</h1>
      <button onclick="ukazCitat()">Chci radu!</button>
    </div>

    <!-- PRAVÁ ČÁST: Klikání -->
    <div style="display: flex; flex-direction: column; align-items: center;">
      <h1 id="pocitadlo" style="font-size: 14px; margin-bottom: 5px;">Skóre: 0</h1>
      <button onclick="klikni()">KLIKNI NA MĚ!</button>
    </div>

  </div>
</div>

        <!-- Tlačítko, které spouští tvou funkci -->
        <form onsubmit="alert('Odesláno!'); return false;">
          <input class="email" type="email" placeholder="Tvůj e-mail" required>
          <button id="odeslat" type="submit">Odeslat</button>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="script.js?v=1.1"></script>

  <!-- 2. Pak samostatně zaregistrujeme Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("SW registrován"))
        .catch(err => console.log("Chyba SW:", err));
    }
  </script>
</body>
</html>
